name: task_manager_app
description: A production-ready Flutter task management application
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  
  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path_provider: ^2.1.1
  
  # Networking
  dio: ^5.4.0
  json_annotation: ^4.9.0
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_hooks: ^0.20.5
  
  # Utilities
  connectivity_plus: ^5.0.2
  equatable: ^2.0.5
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Testing
  mocktail: ^1.0.3
  mockito: ^5.4.3
  integration_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.8.0
  
  # Coverage
  coverage: ^1.7.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
  
  generate: true